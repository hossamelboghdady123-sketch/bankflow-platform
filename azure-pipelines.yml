trigger:
  - main

pool:
  name: Default

variables:
  backendPath: 'backend/bankflow-api'
  dockerHubConnection: 'Docker Hub'
  dockerHubUsername: 'hossam789'

steps:
  - checkout: self

  - script: |
      set -e
      docker rm -f bankflow-ci-postgres 2>/dev/null || true

      docker run -d \
        --name bankflow-ci-postgres \
        -e POSTGRES_DB=bankflow_test \
        -e POSTGRES_USER=bankflow_app \
        -e POSTGRES_PASSWORD=ci_test_password \
        -p 127.0.0.1:5434:5432 \
        postgres:16

      for i in $(seq 1 30); do
        if docker exec bankflow-ci-postgres pg_isready -U bankflow_app -d bankflow_test; then
          echo "PostgreSQL is ready"
          exit 0
        fi
        sleep 2
      done

      docker logs bankflow-ci-postgres
      exit 1
    displayName: 'Start CI PostgreSQL'

  - script: |
      set -e
      cd "$(backendPath)"
      chmod +x mvnw
      ./mvnw test
    displayName: 'Run Backend Tests'
    env:
      BANKFLOW_DB_URL: jdbc:postgresql://localhost:5434/bankflow_test
      BANKFLOW_DB_USERNAME: bankflow_app
      BANKFLOW_DB_PASSWORD: ci_test_password

  - script: |
      set -e
      docker build \
        -t $(dockerHubUsername)/bankflow-api:$(Build.BuildId) \
        -t $(dockerHubUsername)/bankflow-api:latest \
        ./backend/bankflow-api
    displayName: 'Build Backend Docker Image'

  - script: |
      set -e
      docker build \
        -t $(dockerHubUsername)/bankflow-frontend:$(Build.BuildId) \
        -t $(dockerHubUsername)/bankflow-frontend:latest \
        ./frontend
    displayName: 'Build Frontend Docker Image'

  - task: Docker@2
    displayName: 'Push Backend Image to Docker Hub'
    inputs:
      command: push
      containerRegistry: $(dockerHubConnection)
      repository: $(dockerHubUsername)/bankflow-api
      tags: |
        $(Build.BuildId)
        latest

  - task: Docker@2
    displayName: 'Push Frontend Image to Docker Hub'
    inputs:
      command: push
      containerRegistry: $(dockerHubConnection)
      repository: $(dockerHubUsername)/bankflow-frontend
      tags: |
        $(Build.BuildId)
        latest

  - script: |
      set -euo pipefail

      kind load docker-image "$(dockerHubUsername)/bankflow-api:$(Build.BuildId)" --name bankflow-local
      kind load docker-image "$(dockerHubUsername)/bankflow-frontend:$(Build.BuildId)" --name bankflow-local

      helm upgrade --install bankflow ./helm/bankflow \
        --kube-context kind-bankflow-local \
        --namespace bankflow \
        --set backend.tag="$(Build.BuildId)" \
        --set frontend.tag="$(Build.BuildId)"

      kubectl --context kind-bankflow-local -n bankflow rollout status deployment/bankflow-api --timeout=180s
      kubectl --context kind-bankflow-local -n bankflow rollout status deployment/bankflow-frontend --timeout=180s
    displayName: 'Deploy BankFlow to local Kubernetes'

  - script: |
      docker rm -f bankflow-ci-postgres 2>/dev/null || true
    displayName: 'Cleanup CI PostgreSQL'
    condition: always()
