spring.application.name=bankflow-api

spring.datasource.url=${BANKFLOW_DB_URL:jdbc:postgresql://localhost:5433/bankflow}
spring.datasource.username=${BANKFLOW_DB_USERNAME:bankflow_app}
spring.datasource.password=${BANKFLOW_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
