services:
  bankflow-api:
    image: bankflow-api:1.0
    container_name: bankflow-api
    restart: unless-stopped
    environment:
      BANKFLOW_DB_URL: jdbc:postgresql://bankflow-postgres:5432/bankflow
      BANKFLOW_DB_USERNAME: bankflow_app
      BANKFLOW_DB_PASSWORD: ${BANKFLOW_DB_PASSWORD}
    networks:
      - bankflow-network

  bankflow-frontend:
    image: bankflow-frontend:1.0
    container_name: bankflow-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - bankflow-api
    networks:
      - bankflow-network

networks:
  bankflow-network:
    external: true
    name: database_default
