apiVersion: v1
kind: Service
metadata:
  name: bankflow-frontend
spec:
  type: ClusterIP
  selector:
    app: bankflow-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankflow-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bankflow-frontend
  template:
    metadata:
      labels:
        app: bankflow-frontend
    spec:
      containers:
        - name: bankflow-frontend
          image: hossam789/bankflow-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
