apiVersion: v1
kind: Service
metadata:
  name: bankflow-postgres
spec:
  selector:
    app: bankflow-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bankflow-postgres
spec:
  serviceName: bankflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app: bankflow-postgres
  template:
    metadata:
      labels:
        app: bankflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: bankflow
            - name: POSTGRES_USER
              value: bankflow_app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bankflow-db
                  key: password
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U bankflow_app -d bankflow
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
